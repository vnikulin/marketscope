name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: shellcheck install.sh scripts/marketscope scripts/package-release.sh
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"

      - name: Select image tags
        id: tags
        run: |
          {
            echo 'value<<EOF'
            echo "${{ steps.image.outputs.name }}:$GITHUB_REF_NAME"
            if [[ "$GITHUB_REF_NAME" != *-* ]]; then
              echo "${{ steps.image.outputs.name }}:latest"
            fi
            echo 'EOF'
          } >>"$GITHUB_OUTPUT"

      - name: Build and publish container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.value }}
          build-args: |
            MARKETSCOPE_BUILD_VERSION=${{ github.ref_name }}
            MARKETSCOPE_SOURCE_URL=${{ github.server_url }}/${{ github.repository }}

      - name: Package installer assets
        run: bash scripts/package-release.sh "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$RUNNER_TEMP/release"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber \
              "$RUNNER_TEMP/release/install.sh" \
              "$RUNNER_TEMP/release/marketscope-linux.tar.gz" \
              "$RUNNER_TEMP/release/marketscope-linux.tar.gz.sha256"
          else
            release_options=(--verify-tag --generate-notes)
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              release_options+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" "${release_options[@]}" \
              "$RUNNER_TEMP/release/install.sh" \
              "$RUNNER_TEMP/release/marketscope-linux.tar.gz" \
              "$RUNNER_TEMP/release/marketscope-linux.tar.gz.sha256"
          fi
